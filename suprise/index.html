<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        /* A simple style just in case the redirect takes a second */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 20%;
            color: #333;
        }
    </style>
    <script>

        const link1 = "https://youtube.com/@NotPays";
        const link2 = "https://youtube.com/@Mr.metogamer";

        // Math.random() generates a number between 0 and 1. 
        if (Math.random() < 0.5) {
            window.location.replace(link1);
        } else {
            window.location.replace(link2);
        }
    </script>
</head>
<body>
    <h2>Redirecting you to the right page...</h2>
    <p>If you are not redirected automatically within a few seconds, please enable JavaScript.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelogs</title>
    <link rel="canonical" href="https://felinegames.qzz.io/changelogs" />
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" href="../icon.png" type="image/png">
    <link rel="apple-touch-icon" href="../icon.png">
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/stylesheet.css" />
</head>
<body>

    <header class="navbar">
        <button class="menu-button" id="menuToggle" aria-label="Toggle Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="menu-popup" id="menuPopup">
            <a href="../home/">Home</a>
            <a href="../policy/">Privacy Policy</a>
            <a href="../archives/">Archives</a>
        </nav>
        <span class="brand-text">Feline Games</span>
    </header>

    <main class="main-container">

        <a href="https://felinegames.github.io/forge" class="back-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Back to Home
        </a>
        
        <div class="sub-navbar">
            <a href="../downloads/">Download</a>
            <a href="../credits/">Credits</a>
            <a class="active" href="#">Changelogs</a>
        </div>

        <div class="content-card left-align">
            
            <!-- Murkmask Dropdown -->
            <details>
                <summary class="black-text">Murkmask Updates</summary>
                <div class="dropdown-content">
                    <h2 class="content-subtitle gren-text">Latest Version </h2>
                    <ul>
                        <li>initial release</li>
                        <li>Supports Windows 10+ & Upto Android 16</li>
                    </ul>
                </div>
            </details>

            <!-- Murkmask Revelations Dropdown -->
            <details>
                <summary class="black-text">Murkmask: Revelations Updates</summary>
                <div class="dropdown-content">
                    <h2 class="content-subtitle gren-text">Latest Version </h2>
                    <ul>
                        <li>initial release (planned)</li>
                    </ul>
                </div>
            </details>

        </div>

    </main>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const menuPopup = document.getElementById('menuPopup');
        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            menuPopup.classList.toggle('show');
        });
        document.addEventListener('click', () => {
            menuPopup.classList.remove('show');
        });
    </script>
</body>
</html>

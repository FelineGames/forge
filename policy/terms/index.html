<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms of Services</title>
    <link rel="canonical" href="https://felinegames.qzz.io/policy/terms" />
    <link rel="icon" href="../../favicon.ico" sizes="any">
    <link rel="icon" href="../../icon.png" type="image/png">
    <link rel="apple-touch-icon" href="../../icon.png">
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/stylesheet.css" />
</head>
<body class="policy-browse-body">

    <header class="top-nav">
        <a href="../index.html" class="nav-back-button" title="Go Back">&#8592;</a>
        
        <div class="search-container">
            <span class="search-icon">&#128269;</span>
            <input type="text" id="searchInput" placeholder="Terms of Services">
        </div>
    </header>

    <main class="policy-content">

        <a href="murkmask/index.html" class="browse-card">
            <img src="../../assets/icons/murkmask.png" alt="Icon" class="browse-card-img">
            <div class="browse-card-text">
                <h3 class="browse-card-title">Murkmask - Horror Escape</h3>
                <p class="browse-card-desc">A Trademark™ of Feline Games</p>
            </div>
        </a>

    </main>

    <script>
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.browse-card');

            cards.forEach(card => {
                const title = card.querySelector('.browse-card-title').textContent.toLowerCase();
                const desc = card.querySelector('.browse-card-desc').textContent.toLowerCase();

                if (title.includes(searchTerm) || desc.includes(searchTerm)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>

</body>
</html>

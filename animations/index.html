<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Murkmask</title>
    <link rel="canonical" href="https://felinegames.qzz.io/download" />
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* Changed dark red/brown tint to dark blue tint */
            background-color: #02060b; 
            color: #cccccc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .navBar {
            /* Converted red/maroon background to deep blue */
            background-color: #001f3a; 
            border: 2px solid #003380;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-around;
            padding: 10px 5px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
        }
        .navBar a {
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.3s, color 0.3s;
        }
        .navBar-active {
            /* Converted bright red active states to bright cyan/blue */
            color: #33aaff;
            background-color: #00111a;
            border: 1px solid #0088ff;
            text-shadow: 0 0 5px #0088ff;
        }
        .navBar-inactive {
            color: #999999;
        }
        .navBar-inactive:hover {
            color: #ffffff;
            background-color: #002b4a; /* Blue hover */
        }
        .background {
            background-color: #000000;
            border-radius: 12px;
            padding: 25px 20px;
            width: 100%;
            max-width: 500px;
            /* Converted red outline to blue outline */
            outline: #004499 solid 3px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9);
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h2 {
            font-size: 18px;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #aaaaaa;
            margin-bottom: 15px;
        }
        /* Changed text classes to blue themes */
        .blue-text { color: #0066cc; text-shadow: 0 0 4px #002255; }
        .light-blue-text { color: #3388ff; }
        
        .divider {
            color: #002255;
            margin: 20px 0;
            font-weight: bold;
            letter-spacing: 3px;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .overview-text {
            text-align: left;
            background-color: #001122;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #0088ff;
        }
        .back-btn {
            position: absolute;
            top: 2px;
            left: 16px;
            color: #bfc6cf; 
            font-size: 12px;
            font-family: Inter, system-ui, sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            transition: color 0.2s ease;
            z-index: 9999; 
        }
        .back-btn:hover {
            color: #8ce0ff; 
        }
        .back-btn svg {
            width: 14px;
            height: 8px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <a href="https://felinegames.github.io/forge" class="back-btn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      Back
    </a>

    <div class="navBar">
        <a class="navBar-active" href="#">Animations</a>
    </div>

    <!-- Single Remaining Card -->
    <div class="background">
        <h1 class="light-blue-text">Teaser Trailer</h1>
        
        <!-- Embedded YouTube Video -->
        <div class="video-container">
            
            <iframe 
                src="https://www.youtube.com/embed/a74AnWGVy4g?si=SR50b9CNTBVY3sbW" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- Overview Text Placeholder -->
        <div class="overview-text">
            <p style="margin-bottom: 0;">Made by An Animator Guy aka JAnimationStudio. A Talented Teenage Boy who made a masterpiece within Blender.</p>
        </div>
    </div>

</body>
</html>
